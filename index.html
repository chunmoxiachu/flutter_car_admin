<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/flutter_car_admin/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="码小象自助洗车，扫码即洗、按分钟计费、24 小时营业。让洗车成为一件顺手的小事。">
  <meta name="theme-color" content="#080B09">
  <meta name="color-scheme" content="dark light">
  <meta property="og:type" content="website">
  <meta property="og:title" content="码小象自助洗车">
  <meta property="og:description" content="随时开洗，让每一次清洁都不用特意安排时间。">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="码小象自助洗车">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>码小象自助洗车｜随时开洗</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      background: #080B09;
      color: #F8FAF3;
    }

    flutter-view {
      background: #080B09;
    }

    #boot-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background:
        radial-gradient(circle at 78% 24%, #1B271E 0, transparent 42%),
        #080B09;
      transition: opacity 300ms ease, visibility 300ms ease;
    }

    #boot-loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-mark {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      border-radius: 15px;
      background: #D8FF43;
      color: #080B09;
      font: 800 24px/1 "Noto Sans SC", sans-serif;
    }

    .boot-name {
      color: #F8FAF3;
      font: 700 14px/1.2 "Noto Sans SC", sans-serif;
      letter-spacing: 0.16em;
    }

    .boot-line {
      width: 96px;
      height: 2px;
      overflow: hidden;
      background: rgba(216, 255, 67, 0.16);
    }

    .boot-line::after {
      display: block;
      width: 42%;
      height: 100%;
      content: "";
      background: #D8FF43;
      animation: boot-progress 1.1s ease-in-out infinite;
    }

    @keyframes boot-progress {
      from {
        transform: translateX(-110%);
      }
      to {
        transform: translateX(340%);
      }
    }
  </style>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="boot-loader" aria-label="正在加载码小象自助洗车">
    <div class="boot-mark">码</div>
    <div class="boot-name">码小象 · SELF WASH</div>
    <div class="boot-line"></div>
  </div>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
            window.addEventListener('flutter-first-frame', function() {
              document.getElementById('boot-loader')?.classList.add('is-hidden');
            }, { once: true });
            setTimeout(function() {
              document.getElementById('boot-loader')?.classList.add('is-hidden');
            }, 8000);
          });
        }
      });
    });
  </script>
</body>
</html>
